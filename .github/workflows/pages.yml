# Publica el sitio en GitHub Pages: https://andremartti.github.io/Nodo-Colibr-/
#
# Configuración (una sola vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Después, cada cambio que llegue a la rama principal
# del repositorio se publica solo. También se puede lanzar a mano: pestaña
# Actions → "Publicar sitio" → Run workflow.
#
# GitHub solo permite publicar desde la rama principal (Settings → Default branch).
# Hoy es claude/wizardly-allen-k1vlok; si se cambia a main, se publicará desde main.

name: Publicar sitio

on:
  push:
    branches: [main, claude/wizardly-allen-k1vlok]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # Versión en los enlaces de CSS y JS: obliga al navegador a descargar
          # los archivos nuevos en cada publicación en lugar de usar su copia guardada.
          V="${GITHUB_SHA::7}"
          sed -i \
            -e "s#assets/css/styles.css#assets/css/styles.css?v=$V#" \
            -e "s#assets/js/main.js#assets/js/main.js?v=$V#" \
            -e "s#<html lang=\"es\" class=\"no-js\">#<html lang=\"es\" class=\"no-js\" data-version=\"$V\">#" \
            _site/index.html
          grep -o 'styles.css?v=[a-f0-9]*\|main.js?v=[a-f0-9]*\|data-version="[a-f0-9]*"' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
